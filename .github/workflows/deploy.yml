name: Deploy

# Автодеплой на VDS при каждом мерже в main — та же последовательность, что в
# deploy/bot.sh (типы → тесты → rsync src и манифестов → зависимости →
# перезапуск юнита → проверка, что жив). Нужны секреты репозитория
# VPS_HOST, VPS_USER, VPS_SSH_KEY (и VPS_PORT, если не 22) — без них шаги
# деплоя пропускаются, а проверки всё равно идут.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ts
      - run: npm test

      - name: SSH-ключ деплоя
        if: env.VPS_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync src и манифестов на VDS
        if: env.VPS_HOST != ''
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22}"
          rsync -rtc --delete -e "$SSH" src/ "$VPS_USER@$VPS_HOST:/opt/rokid-ai/src/"
          rsync -rtc -e "$SSH" package.json package-lock.json "$VPS_USER@$VPS_HOST:/opt/rokid-ai/"

      - name: Зависимости, перезапуск, проверка
        if: env.VPS_HOST != ''
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/rokid-ai
            npm install --omit=dev --no-audit --no-fund --loglevel=error
            systemctl restart rokid-ai
            sleep 3
            if systemctl -q is-active rokid-ai; then
              echo "✅ rokid-ai поднялся, последние строки лога:"
              journalctl -u rokid-ai -n 5 --no-pager
            else
              echo "❌ rokid-ai НЕ поднялся, лог падения:"
              journalctl -u rokid-ai -n 30 --no-pager
              exit 1
            fi
          '
